// 推荐逻辑：同类型其他作品
function getRecommends(work) {
  if (work.recommend) return work.recommend;
  return Object.values(WORKS)
    .filter(w => w.id !== work.id && w.type === work.type)
    .slice(0, 3)
    .map(w => ({ title: w.title, id: w.id }));
}

let curWork = null;

window.addEventListener('DOMContentLoaded', () => {
  const p = new URLSearchParams(location.search);
  const id = p.get('id') || 'aot';
  curWork = WORKS[id] || WORKS['aot'];
  renderWork();

  // 高亮导航
  const navMap = { anime:'nav-anime', manga:'nav-manga', game:'nav-game' };
  const navId = navMap[curWork.type];
  if (navId) document.getElementById(navId)?.classList.add('active');

  // 收藏状态
  const favBtn = document.getElementById('fav-btn');
  if (Favorites.has(curWork.id)) {
    favBtn.innerHTML = '<i class="fa-solid fa-bookmark"></i> 已收藏';
    favBtn.classList.add('faved');
  }

  // 搜索跳转
  document.getElementById('header-search').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const q = e.target.value.trim();
      if (q) location.href = 'anime.html?search=' + encodeURIComponent(q);
    }
  });
});

function renderWork() {
  const w = curWork;
  document.title = w.title + ' — Anime Nexus';

  const typeIcon  = { anime:'fa-tv', manga:'fa-book-open', game:'fa-gamepad' };
  const typeLabel = { anime:'动画', manga:'漫画', game:'游戏' };
  const backUrl   = { anime:'anime.html', manga:'manga.html', game:'game.html' }[w.type] || 'anime.html';

  // Hero 封面（图片优先，无图片则色块）
  const coverEl = document.getElementById('work-cover');
  if (w.coverImg) {
    coverEl.style.backgroundImage = `url('${w.coverImg}')`;
    coverEl.style.backgroundSize = 'cover';
    coverEl.style.backgroundPosition = 'center';
    coverEl.innerHTML = '';
    coverEl.classList.add('has-img');
  } else {
    coverEl.style.background = w.coverColor || '#2a2a3a';
    coverEl.innerHTML = `<i class="fa-solid ${typeIcon[w.type]||'fa-star'}"></i>`;
  }

  // Hero 背景模糊层
  const heroBg = document.getElementById('work-hero-bg');
  if (w.coverImg) {
    heroBg.style.backgroundImage = `url('${w.coverImg}')`;
    heroBg.style.backgroundSize = 'cover';
    heroBg.style.backgroundPosition = 'center';
    heroBg.style.filter = 'blur(18px) brightness(0.35) saturate(1.5)';
    heroBg.style.transform = 'scale(1.08)';
  } else {
    heroBg.style.background = w.coverColor || '#1a1a2e';
  }

  document.getElementById('work-title').textContent = w.title;
  document.getElementById('work-title-sub').textContent = w.sub || '';
  document.getElementById('work-desc').textContent = w.desc || '';
  document.getElementById('work-breadcrumb').innerHTML =
    `<a href="world.html">首页</a><span>/</span><a href="${backUrl}">${typeLabel[w.type]}</a><span>/</span><span>${w.title}</span>`;
  document.getElementById('work-tags-row').innerHTML =
    `<span class="tag ${w.type}">${typeLabel[w.type]}</span>` +
    (w.meta.type ? `<span class="work-meta-tag">${w.meta.type}</span>` : '') +
    (w.meta.year ? `<span class="work-meta-tag">${w.meta.year}</span>` : '');

  // Meta 网格（取前4条）
  const metaKeyMap = { type:'类型',episodes:'集数',volumes:'卷数',year:'年份',studio:'制作',director:'导演',author:'原作',publisher:'出版社',developer:'开发商',platforms:'平台',rating:'分级' };
  const metaItems = Object.entries(w.meta).slice(0,4)
    .map(([k,v]) => `<div class="work-meta-item"><div class="wmi-label">${metaKeyMap[k]||k}</div><div class="wmi-val">${v||'—'}</div></div>`)
    .join('');
  document.getElementById('work-meta-grid').innerHTML = metaItems;

  // 评分面板
  const s = w.scores;
  const validScores = [s.bangumi, s.douban, s.mal].filter(Boolean);
  const avg = validScores.reduce((a,b) => a+b, 0) / validScores.length;
  document.getElementById('work-score-panel').innerHTML = `
    <div class="wsp-avg">${avg.toFixed(1)}</div>
    <div class="wsp-label">综合评分</div>
    <div class="wsp-rows">
      <div class="wsp-row"><span>Bangumi</span><strong>${s.bangumi||'—'}</strong></div>
      <div class="wsp-row"><span>豆瓣</span><strong>${s.douban||'—'}</strong></div>
      <div class="wsp-row"><span>MAL</span><strong>${s.mal||'—'}</strong></div>
    </div>`;

  // 剧情简介
  document.getElementById('work-story').innerHTML = `<p>${w.story}</p>`;

  // 评分条
  const bars = [['Bangumi', s.bangumi, 10], ['豆瓣', s.douban, 10], ['MAL', s.mal, 10]];
  document.getElementById('score-bars').innerHTML = bars.filter(b=>b[1]).map(([name,val]) => `
    <div class="score-bar-row">
      <span class="score-bar-label">${name}</span>
      <div class="score-bar-track"><div class="score-bar-fill" style="width:${(val/10)*100}%"></div></div>
      <span class="score-bar-val">${val}</span>
    </div>`).join('');
  document.getElementById('score-detail').innerHTML =
    `<div class="sd-item"><div class="sd-num">${avg.toFixed(1)}</div><div class="sd-label">综合均分</div></div>` +
    `<div class="sd-item"><div class="sd-num">${validScores.length}</div><div class="sd-label">评分来源</div></div>` +
    `<div class="sd-item"><div class="sd-num">${s.bangumi||'—'}</div><div class="sd-label">Bangumi</div></div>`;

  // 角色列表
  if (w.cast && w.cast.length) {
    document.getElementById('section-cast').style.display = '';
    document.getElementById('cast-grid').innerHTML = w.cast.map(c => `
      <div class="cast-card">
        <div class="cast-avatar">${c.name[0]}</div>
        <div class="cast-info">
          <div class="cast-name">${c.name}</div>
          <div class="cast-role">${c.role}</div>
          <div class="cast-cv">CV：${c.cv}</div>
        </div>
      </div>`).join('');
  }

  // 基本信息
  document.getElementById('info-list').innerHTML =
    Object.entries(w.info).map(([k,v]) => `<div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v}</span></div>`).join('');

  // 同系列
  document.getElementById('related-works').innerHTML =
    (w.related||[]).map(r => `<a href="work-detail.html?id=${r.id}" class="related-item"><i class="fa-solid fa-link" style="font-size:10px;opacity:0.5;margin-right:6px"></i>${r.title}</a>`).join('');

  // 你可能喜欢
  const recommends = getRecommends(w);
  document.getElementById('recommend-works').innerHTML =
    recommends.map(r => {
      const rw = WORKS[r.id];
      const icon = rw ? { anime:'fa-tv', manga:'fa-book-open', game:'fa-gamepad' }[rw.type] : 'fa-star';
      return `<a href="work-detail.html?id=${r.id}" class="related-item"><i class="fa-solid ${icon}" style="font-size:10px;opacity:0.5;margin-right:6px"></i>${r.title}</a>`;
    }).join('');

  // 社区帖子
  document.getElementById('work-posts').innerHTML = (w.posts||[]).map(p => `
    <a href="post-detail.html?demo=${p.id}" class="work-post-item">
      <div class="wp-tag"><span class="tag ${p.type||'anime'}" style="font-size:10px">${{anime:'动画',manga:'漫画',game:'游戏'}[p.type]||'动画'}</span></div>
      <div class="wp-title">${p.title}</div>
      <div class="wp-meta">${p.author} · ${p.time} · ❤️${p.votes} · 💬${p.comments}</div>
    </a>`).join('');
}

function toggleFav() {
  if (!Auth.isLoggedIn()) { showToast('请先登录后收藏'); setTimeout(()=>location.href='login.html',1200); return; }
  const added = Favorites.toggle({ id: curWork.id, title: curWork.title, type: curWork.type });
  const btn = document.getElementById('fav-btn');
  btn.innerHTML = added ? '<i class="fa-solid fa-bookmark"></i> 已收藏' : '<i class="fa-solid fa-bookmark"></i> 收藏';
  added ? btn.classList.add('faved') : btn.classList.remove('faved');
}

function shareWork() {
  if (navigator.clipboard) navigator.clipboard.writeText(location.href);
  showToast('✓ 链接已复制');
}
</script>
</body>
</html>
